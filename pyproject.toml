[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backend._legacy:_Backend"

[project]
name = "django-usp-theme"
version = "0.1.0"
description = "Tema visual USP para aplicações Django — design system, componentes e templates reutilizáveis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["django>=4.2"]

[project.urls]
Repository = "https://github.com/usp/django-usp-theme"

[tool.setuptools.packages.find]
include = ["django_usp_theme*"]

[tool.setuptools.package-data]
django_usp_theme = [
    "static/**/*",
    "templates/**/*",
]
